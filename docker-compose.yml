services:

  # ── PostgreSQL + pgvector ────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-recruiter_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is mounted into initdb.d — Postgres runs it automatically
      # the first time the data volume is created (IF NOT EXISTS guards are safe
      # if you ever re-run manually too).
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruiter} -d ${POSTGRES_DB:-recruiter_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI app ───────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the localhost DATABASE_URL from .env with the docker service hostname.
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD:-recruiter_pass}@db:5432/${POSTGRES_DB:-recruiter_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
