<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>JD Matcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      color: #1a1a2e;
      padding: 40px 16px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Nav */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .nav-link {
      font-size: 0.85rem;
      color: #6366f1;
      text-decoration: none;
      font-weight: 500;
    }

    .nav-link:hover { text-decoration: underline; }

    /* Search card */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 36px 32px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    /* Textarea */
    .jd-wrap { position: relative; }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.55;
      resize: vertical;
      color: #111827;
      transition: border-color 0.2s;
      outline: none;
    }

    textarea:focus { border-color: #6366f1; }
    textarea.error  { border-color: #ef4444; }

    .char-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 0.75rem;
      color: #9ca3af;
      pointer-events: none;
    }

    .char-counter.warn { color: #f59e0b; }
    .char-counter.over { color: #ef4444; font-weight: 600; }

    /* Error */
    .error-box {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #b91c1c;
    }

    .error-box.visible { display: flex; }

    /* Button */
    .search-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .search-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .search-btn:not(:disabled):hover { background: #4f46e5; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results-section { margin-top: 36px; }

    .results-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .result-list { display: flex; flex-direction: column; gap: 14px; }

    .result-item {
      display: flex;
      gap: 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px 20px;
      transition: box-shadow 0.15s;
    }

    .result-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

    /* Rank badge */
    .rank-badge {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-badge.top3 {
      background: #fef9c3;
      color: #92400e;
    }

    .result-body { flex: 1; min-width: 0; }

    .result-name {
      font-size: 1rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 2px;
    }

    .result-email {
      font-size: 0.8rem;
      color: #6366f1;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .result-reason {
      font-size: 0.85rem;
      color: #374151;
      line-height: 1.5;
      margin-bottom: 8px;
      padding: 8px 12px;
      background: #f9fafb;
      border-left: 3px solid #6366f1;
      border-radius: 0 4px 4px 0;
    }

    .result-summary {
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.5;
    }

    .no-results {
      text-align: center;
      padding: 32px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <h1>JD Matcher</h1>
      <a href="/" class="nav-link">&#8592; Resume Ingestor</a>
    </div>

    <div class="card">
      <p class="subtitle">Paste a job description to find and rank the best-matching candidates.</p>

      <div class="jd-wrap">
        <textarea
          id="jdInput"
          placeholder="e.g. We are looking for a senior backend engineer with 5+ years of experience in distributed systems, Python, and Kafka. The role involves owning the data pipeline infrastructure..."
          maxlength="500"
          aria-label="Job description"
        ></textarea>
        <span class="char-counter" id="charCounter">0 / 500</span>
      </div>

      <div class="error-box" id="errorBox" role="alert" aria-live="assertive">
        <span aria-hidden="true">&#9888;</span>
        <span id="errorMsg"></span>
      </div>

      <button class="search-btn" id="searchBtn">Find Matching Candidates</button>
    </div>

    <div class="results-section" id="resultsSection" style="display:none">
      <div class="results-header" id="resultsHeader">Top matches</div>
      <div class="result-list" id="resultList"></div>
    </div>
  </div>

  <script src="/static/search.js"></script>
</body>
</html>
